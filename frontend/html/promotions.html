<!DOCTYPE html>
<html lang="uk">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="../styles/main.css">
    <link rel="stylesheet" href="../styles/promotions.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
    <title>Акції</title>
</head>

<body>
    <header class="header">
        <div class="header__container">
            <div class="contact-info">
                <a href="tel:0502991861" class="phone-number">+38(050)299-18-61 (Безкоштовна лінія)</a>
                <a href="tel:0998948016" class="phone-number">+38(099)894-80-16</a>
                <a href="tel:0660172534" class="phone-number">+38(066)017-25-34</a>
                <div class="auth">
                    <a href="../html/signIn.html" class="auth-link">Увійти/Реєстрація</a>
                </div>
            </div>
            <nav class="navbar">
                <div class="navbar__logo">
                    <a href="../index.html">
                        <img src="https://basketmania.com.ua/image/cache/catalog/BascketMania_logo_slogan_horizontal_937x300-937x300.png"
                            alt="BasketMania Logo" class="navbar__logo-img" />
                    </a>
                </div>
                <div class="navbar__search-bar">
                    <input type="search" placeholder="Пошук..." class="navbar__search-input" />
                    <div class="navbar__search-buttons">
                        <button class="navbar__search-btn">
                            <img src="../images/search.svg" alt="Search" />
                        </button>
                        <button class="navbar__wishlist-btn">
                            <img src="../images/heart.svg" alt="Wishlist" />
                        </button>
                        <button class="navbar__cart-btn">
                            <a href="../html/cart.html"><img src="../images/shopping-cart.svg" alt="Cart" /></a>
                        </button>
                    </div>
                </div>
            </nav>
            <div class="catalog">
                <a href="../index.html" class="catalog-link" style="background-color: #f15a24">Каталог товарів</a>
                <a href="#" class="catalog-link">Акції</a>
                <a href="../html/about-us.html" class="catalog-link">Про нас</a>
                <a href="../html/delivery.html" class="catalog-link">Доставка та оплата</a>
                <a href="../html/returns.html" class="catalog-link">Повернення та обмін</a>
                <a href="../html/trust-us.html" class="catalog-link">Нам довіряють</a>
                <a href="../html/contacts.html" class="catalog-link">Контакти</a>
            </div>
        </div>
    </header>

    <div class="container">
        <h1 class="text-center m-4 fw-bold">Акції</h1>
        <hr class="mb-5 w-50 mx-auto" />
        <div id="categories-container" class="mb-4 text-center"></div>
        <div id="products-container" class="row g-4"></div>
    </div>

    </main>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const productsContainer = document.getElementById('products-container');
            const categoriesContainer = document.getElementById('categories-container');

            async function loadProducts(categoryId = null) {
                try {
                    let url = 'http://localhost/php-shop/backend/products.php';
                    if (categoryId) {
                        url += `?category_id=${categoryId}`;
                    }

                    const response = await fetch(url);
                    const products = await response.json();
                    renderProducts(products);
                } catch (error) {
                    console.error('Помилка при завантаженні товарів:', error);
                }
            }

            function renderProducts(products) {
                productsContainer.innerHTML = '';

                products.forEach(product => {
                    const discountedPrice = (product.price * (1 - product.discount_percent / 100)).toFixed(2);
                    const hasDiscount = product.discount_percent > 0;

                    const card = document.createElement('div');
                    card.className = 'col-sm-12 col-md-6 col-lg-4';
                    card.innerHTML = `
                    <div class="card h-100 shadow-sm">
                        <img src="${product.image_url}" class="card-img-top" alt="${product.title}" style="object-fit: cover; height: 250px;" />
                        <div class="card-body d-flex flex-column">
                            <h5 class="card-title">${product.title}</h5>
                            <p class="card-text text-muted small">${product.description}</p>
                            <div class="mt-auto">
                                <p class="mb-2">
                                    <span class="fw-bold text-success">$${discountedPrice}</span>
                                    ${hasDiscount ? `<span class="text-muted text-decoration-line-through ms-2">$${product.price}</span>` : ''}
                                </p>
                                ${hasDiscount ? `<span class="badge bg-danger mb-3">-${product.discount_percent}%</span>` : ''}
                                <div class="d-flex gap-2">
                                    <button class="btn btn-success w-50 buy-btn" data-product-id="${product.id}">Купити</button>
                                    <button class="btn btn-light w-50">
                                        <img src="../images/heart.svg" width="20" height="20" alt="Wishlist" />
                                    </button>
                                </div>
                            </div>
                        </div>
                    </div>
                `;
                    productsContainer.appendChild(card);
                });
            }

            async function addToCart(productId) {
                try {
                    const response = await fetch('http://localhost/php-shop/backend/add_to_cart.php', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ product_id: productId })
                    });

                    const result = await response.json();

                    if (result.success) {
                        alert(result.success);
                    } else {
                        alert(result.error);
                    }
                } catch (error) {
                    console.error('Помилка при додаванні товару в корзину:', error);
                }
            }
            productsContainer.addEventListener('click', event => {
                const buyButton = event.target.closest('.buy-btn');
                if (buyButton) {
                    const productId = buyButton.dataset.productId;
                    addToCart(productId);
                }
            });
            async function loadCategories() {
                try {
                    const response = await fetch('http://localhost/php-shop/backend/categories.php');
                    const categories = await response.json();

                    categoriesContainer.innerHTML = '';

                    // Кнопка "Усі товари"
                    const allButton = document.createElement('button');
                    allButton.className = 'btn btn-primary m-2';
                    allButton.textContent = 'Усі товари';
                    allButton.addEventListener('click', () => loadProducts());
                    categoriesContainer.appendChild(allButton);

                    // Кнопки по категориям
                    categories.forEach(category => {
                        const button = document.createElement('button');
                        button.className = 'btn btn-outline-primary m-2';
                        button.textContent = category.name;
                        button.addEventListener('click', () => loadProducts(category.id));
                        categoriesContainer.appendChild(button);
                    });
                } catch (error) {
                    console.error('Помилка при завантаженні категорій:', error);
                }
            }

            loadCategories();
            loadProducts();
        });
    </script>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz"
        crossorigin="anonymous"></script>
</body>

</html>
