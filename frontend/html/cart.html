<!DOCTYPE html>
<html lang="uk">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Кошик</title>
    <link rel="stylesheet" href="../styles/main.css" />
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
  </head>

  <body>
    <!-- Header -->
    <header class="header">
      <div class="header__container">
        <div class="contact-info">
          <a href="tel:0502991861" class="phone-number"
            >+38(050)299-18-61 (Безкоштовна лінія)</a
          >
          <a href="tel:0998948016" class="phone-number">+38(099)894-80-16</a>
          <a href="tel:0660172534" class="phone-number">+38(066)017-25-34</a>
          <div class="auth">
            <a href="../html/signIn.html" class="auth-link">Вхід/Регестрація</a>
          </div>
        </div>
        <!-- NavBar menu -->
        <nav class="navbar">
          <div class="navbar__logo">
            <a href="../index.html">
              <img
                src="https://basketmania.com.ua/image/cache/catalog/BascketMania_logo_slogan_horizontal_937x300-937x300.png"
                alt="BasketMania Logo"
                class="navbar__logo-img"
              />
            </a>
          </div>
          <div class="navbar__search-bar">
            <input
              type="search"
              placeholder="Search..."
              class="navbar__search-input"
            />
            <div class="navbar__search-buttons">
              <button class="navbar__search-btn">
                <img src="../images/search.svg" alt="Search" />
              </button>
              <button class="navbar__wishlist-btn">
                <img src="../images/heart.svg" alt="Wishlist" />
              </button>
              <button class="navbar__cart-btn">
                <a href="../html/cart.html"
                  ><img src="../images/shopping-cart.svg" alt="Cart"
                /></a>
              </button>
            </div>
          </div>
        </nav>
        <!-- Catalog -->
        <div class="catalog">
          <a
            href="../index.html"
            class="catalog-link"
            style="background-color: #f15a24"
            >Каталог товарів</a
          >
          <a href="../html/promotions.html" class="catalog-link">Акції</a>
          <a href="../html/about-us.html" class="catalog-link">Про нас</a>
          <a href="../html/delivery.html" class="catalog-link"
            >Доставка та оплата</a
          >
          <a href="../html/returns.html" class="catalog-link"
            >Повернення та обмін</a
          >
          <a href="../html/trust-us.html" class="catalog-link">Нам довіряють</a>
          <a href="../html/contacts.html" class="catalog-link">Контакти</a>
        </div>
      </div>
    </header>

    <div class="container my-5">
      <h1 class="text-center mb-4">Ваш кошик</h1>
      <div id="cart-container" class="row g-4"></div>

      <div id="cart-summary" class="text-end mt-4">
        <h4>
          Разом:
          <span id="total-price" class="text-success fw-bold">$0.00</span>
        </h4>
        <button class="btn btn-primary mt-3">Оформити замовлення</button>
      </div>
    </div>

    <script>
      function loadCart() {
        fetch("http://localhost/php-shop/backend/get_cart.php")
          .then((response) => response.json())
          .then((cartItems) => {
            const container = document.getElementById("cart-container");
            container.innerHTML = "";

            if (cartItems.length === 0) {
              container.innerHTML =
                "<p class='text-center'>Ваш кошик порожній 🛒</p>";
              document.getElementById("cart-summary").style.display = "none";
              return;
            }

            let totalPrice = 0;

            cartItems.forEach((item) => {
              const itemTotal = item.price * item.quantity;
              totalPrice += itemTotal;

              const col = document.createElement("div");
              col.className = "col-12";

              col.innerHTML = `
              <div class="card shadow-sm p-3 d-flex flex-row align-items-center">
                <img src="${item.image_url}" alt="${item.title}" class="me-4" style="width: 100px; height: 100px; object-fit: cover;">
                <div class="flex-grow-1">
                  <h5>${item.title}</h5>
                  <p class="mb-1 text-muted">${item.description}</p>
                  <p class="mb-0">
                    Ціна: <span class="fw-bold">$${item.price}</span> | Кількість: <span class="fw-bold">${item.quantity}</span>
                  </p>
                </div>
                <button class="btn btn-danger btn-sm ms-4 remove-btn" data-cart-id="${item.id}">Видалити</button>
              </div>
            `;
              container.appendChild(col);
            });

            document.getElementById(
              "total-price"
            ).textContent = `$${totalPrice.toFixed(2)}`;
          })
          .catch((error) =>
            console.error("Помилка завантаження кошика:", error)
          );
      }
      document.addEventListener("click", function (e) {
        if (e.target.classList.contains("remove-btn")) {
          const cartId = e.target.getAttribute("data-cart-id");
          console.log("Удаляем товар с cart_id:", cartId);

          fetch("http://localhost/php-shop/backend/remove_from_cart.php", {
            method: "POST",
            headers: {
              "Content-Type": "application/json",
            },
            body: JSON.stringify({ cart_id: cartId }),
          })
            .then((response) => response.json())
            .then((data) => {
              if (data.success) {
                alert("Товар був видалений з кошика.");
                loadCart();
              } else {
                alert(data.error);
              }
            })
            .catch((error) =>
              console.error("Помилка видалення товару:", error)
            );
        }
      });

      loadCart();
    </script>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  </body>
</html>
